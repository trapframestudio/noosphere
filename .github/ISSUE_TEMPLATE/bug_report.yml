name: Bug report
description: Something is broken or behaving unexpectedly.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. The more detail you provide, the faster we can fix it.

        **Security issues should NOT be filed here.** Use [private vulnerability reporting](https://github.com/joniler/noosphere/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably trigger the bug.
      placeholder: |
        1. Run `cargo build -p simn-godot`
        2. Open `godot/project.godot`
        3. Load a scene with [specific node]
        4. Observe [error/crash]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Affected area
      description: Which crate or system? (e.g. `simn-sim`, `simn-godot`, `simn-common`)
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Noosphere version / commit
      description: Output of `git rev-parse --short HEAD` or release tag.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: godot-version
    attributes:
      label: Godot version
      description: e.g. 4.3.stable
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Relevant output from Godot console, `cargo` build, or `RUST_BACKTRACE=1` runs.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through private reporting).
          required: true
