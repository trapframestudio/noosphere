name: Feature request
description: Suggest a new feature, format, system, or improvement.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. For larger ideas, consider opening a [Discussion](https://github.com/joniler/noosphere/discussions) first to get feedback before formalizing it as an issue.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user-facing problem or limitation. "It would be cool if..." is fine, but a concrete pain point is better.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Sketch the API, UI, or behavior if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they're worse.
    validations:
      required: false
  - type: input
    id: area
    attributes:
      label: Affected area
      description: Which crate or system? (e.g. `simn-sim`, `simn-godot`, `modding API`, `docs`)
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and discussions and didn't find a duplicate.
          required: true
        - label: I've read CONTRIBUTING.md and this fits the project's scope.
          required: true
