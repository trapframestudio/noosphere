# Canonical faction registry.
#
# Modders override by dropping their own `factions.toml` overlay (the
# overlay loader lands in a follow-up commit). At least one top-level
# faction must be declared. Subfaction = `parent = "..."` pointing at
# another faction by name; subfactions inherit relations from their
# parent unless an explicit override is declared below.
#
# Roster: 9 top-level + 7 subfactions = 16 faction ids. Mirrors the
# canonical lore in `docs/book/src/lore/factions/`.
#
# `default_relation` is what missing pairs fall back to. Anything
# explicitly listed is an override.

default_relation = "neutral"
player_baseline = "wanderers"

# ─── State factions ─────────────────────────────────────────────────

[[faction]]
name = "pwa"
display = "PWA"
road_friendly = true
base_aggression = 0.60
default_loadout = "pwa_basic"
debug_color = [0xCC, 0xCC, 0x33]
archetype = "disciplined"
# Coalition faction.
# Heavily multicultural West Coast baseline: American dominant, with
# strong East Asian + Latin American + Western European subpopulations
# (a multicultural baseline). Some Slavic ancestry
# (shapes the name weights).
[faction.nationality_weights]
american = 8
east_asian = 3
latin_american = 3
western_european = 2
slavic = 1
south_asian = 1
west_african = 1
middle_eastern = 1

# Linemen — PWA elite grid-defense subfaction. Inherit PWA externally
# but explicitly hostile to Compact-funded extraction.
[[faction]]
name = "linemen"
parent = "pwa"
display = "Linemen"
road_friendly = true
base_aggression = 0.85
default_loadout = "linemen_elite"
debug_color = [0xFF, 0xCC, 0x00]
archetype = "aggressive"
# US-mainland recruitment lean. Multicultural baseline still
# present (any non-zero bucket has a chance) but American-roster
# names dominate.
[faction.nationality_weights]
american = 6
western_european = 2
latin_american = 2
slavic = 1
east_asian = 1
south_asian = 1
west_african = 1
middle_eastern = 1

[[faction]]
name = "revere_guard"
display = "Revere's Guard"
road_friendly = true
base_aggression = 0.70
default_loadout = "rg_basic"
debug_color = [0x99, 0x33, 0x33]
archetype = "disciplined"
# Inland-NW militia (Idaho/Nevada origin, pushed into Hood River /
# Eastern Oregon). Conservative-American demographic profile.
# Heavily American + small Western European; almost nothing else.
[faction.nationality_weights]
american = 14
western_european = 2
latin_american = 1
slavic = 1

[[faction]]
name = "federal"
display = "Federal"
road_friendly = true
base_aggression = 0.75
default_loadout = "federal_basic"
debug_color = [0x33, 0x33, 0x99]
archetype = "disciplined"
# Federal-remnant faction.
# Military / federal-service demographic: American-dominant with
# meaningful Western European, West African, and Latin American
# subpopulations (matches modern US armed-forces makeup).
[faction.nationality_weights]
american = 10
western_european = 2
west_african = 2
latin_american = 2
east_asian = 1
slavic = 1
south_asian = 1
middle_eastern = 1

# Ghost Teams — special operations group. Federal's elite
